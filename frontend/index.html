<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGUS-9 // GLOBAL ESCALATION MONITOR</title>
  <link rel="stylesheet" href="/src/index.css">
</head>
<body>

  <div class="crt-overlay"></div>

  <div id="app-container" class="app">

    <header class="hud-header">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 30 30" style="vertical-align: middle; margin-right: 6px;">
          <circle cx="15" cy="15" r="13" fill="none" stroke="#3A4657" stroke-width="1.5"/>
          <circle cx="15" cy="15" r="8.5" fill="none" stroke="#5EC8C0" stroke-width="1.5"/>
          <circle cx="15" cy="15" r="2.4" fill="#E8A33D"/>
          <line x1="15" y1="1" x2="15" y2="6" stroke="#5EC8C0" stroke-width="1.5"/>
        </svg>
        <span style="letter-spacing: 1.5px;">ARGUS-9 // CONFLICT ESCALATION MONITOR</span>
      </div>
      <div class="header-right">
        <div class="sim-badge" id="hudStatusBadge"><span class="dot"></span>LIVE PIPELINE</div>
        <div class="clock-block">
          <div class="time" id="clockTime">--:--:--</div>
          <div class="zone">UTC</div>
        </div>
        <div style="display:flex; gap: 12px; align-items:center; border-left: 1px solid var(--border-color); padding-left: 16px;">
          <span style="color: var(--text-muted); font-size: 10px; letter-spacing: 1px;">NEXT RECOMPUTE:</span>
          <div class="sync-ring" style="width:28px; height:28px;">
            <svg width="28" height="28" viewBox="0 0 34 34">
              <circle class="track" cx="17" cy="17" r="14"></circle>
              <circle class="fill" id="syncFill" cx="17" cy="17" r="14" stroke-dasharray="87.9" stroke-dashoffset="0"></circle>
            </svg>
            <div class="num" id="syncNum">30</div>
          </div>
        </div>
        <div class="live-chip" style="margin-left: 8px;"><span class="pulse" id="connectionPulse"></span><span id="connectionText">OFFLINE</span></div>
      </div>
    </header>

    <main class="hud-grid main-grid">

      <!-- LEFT: Monitored Theaters (Entity List) -->
      <aside class="col col-scroll" style="width: 320px;">
        <div class="panel-header">
          <span>MONITORED THEATERS</span>
          <span id="idxUpdated" style="font-size:8px;color:var(--text-muted);"></span>
        </div>
        <div id="entity-list" style="overflow-y: auto;">
          <!-- Populated dynamically via main.ts -->
        </div>
      </aside>

      <!-- CENTER: Situation Display & Composite Scoring -->
      <section class="col col-scroll" style="flex: 1; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color);">
        <div class="panel-header">
          <span>SITUATION DISPLAY & COMPOSITE SCORING</span>
          <div class="view-toggle">
            <button id="btnRadar" class="active">RADAR</button>
            <button id="btnGlobe">GLOBE</button>
          </div>
        </div>

        <!-- Selected Theater Viewfinder Card -->
        <div class="viewfinder-card" id="viewfinder-display">
          <!-- Populated dynamically based on selected sector -->
          <div style="text-align: center; color: var(--text-muted); padding: 20px 0;">
            AWAITING PIPELINE DATA SYNC...
          </div>
        </div>

        <!-- SVG Map/Radar Visualization -->
        <div class="display-stack" style="margin: 0 auto 16px; max-width: 300px; aspect-ratio: 1/1;">
          <div class="radar-wrap" id="radarWrap">
            <svg viewBox="0 0 200 200" width="100%" height="100%">
              <circle cx="100" cy="100" r="40" fill="none" stroke="#1D2531" stroke-width="1"/>
              <circle cx="100" cy="100" r="70" fill="none" stroke="#1D2531" stroke-width="1"/>
              <circle cx="100" cy="100" r="98" fill="none" stroke="#232B38" stroke-width="1"/>
              <line x1="100" y1="2" x2="100" y2="198" stroke="#1D2531" stroke-width="1"/>
              <line x1="2" y1="100" x2="198" y2="100" stroke="#1D2531" stroke-width="1"/>
              <line x1="29" y1="29" x2="171" y2="171" stroke="#171D27" stroke-width="1"/>
              <line x1="171" y1="29" x2="29" y2="171" stroke="#171D27" stroke-width="1"/>
              <g class="sweep-group">
                <defs>
                  <radialGradient id="sweepGrad" cx="0" cy="0" r="1">
                    <stop offset="0%" stop-color="#5EC8C0" stop-opacity="0.32"/>
                    <stop offset="100%" stop-color="#5EC8C0" stop-opacity="0"/>
                  </radialGradient>
                </defs>
                <path d="M100,100 L100,2 A98,98 0 0,1 158.8,25.3 Z" fill="url(#sweepGrad)"/>
                <line x1="100" y1="100" x2="100" y2="2" stroke="#8FE0D8" stroke-width="1.3" opacity="0.85"/>
              </g>
              <g id="blipLayer"></g>
            </svg>
            <div class="radar-corners"><span></span><span></span><span></span><span></span></div>
          </div>

          <div class="globe-wrap hidden-view" id="globeWrap">
            <svg viewBox="0 0 200 200" width="100%" height="100%" style="perspective:600px;">
              <circle cx="100" cy="100" r="90" fill="#0D1D1C" stroke="#2E5C58" stroke-width="1"/>
              <g class="globe-rotator" style="transform-style:preserve-3d;">
                <ellipse cx="100" cy="100" rx="90" ry="90" fill="none" stroke="#1D3B39" stroke-width="1"/>
                <ellipse cx="100" cy="100" rx="60" ry="90" fill="none" stroke="#1D3B39" stroke-width="1"/>
                <ellipse cx="100" cy="100" rx="26" ry="90" fill="none" stroke="#1D3B39" stroke-width="1"/>
                <ellipse cx="100" cy="100" rx="90" ry="26" fill="none" stroke="#1D3B39" stroke-width="1"/>
                <ellipse cx="100" cy="100" rx="90" ry="58" fill="none" stroke="#1D3B39" stroke-width="1"/>
                <g id="globeMarkers"></g>
              </g>
            </svg>
          </div>
        </div>

        <!-- Theater Domain Breakdown Grid -->
        <div style="padding: 16px; border-top: 1px solid var(--border-color);">
          <div style="font-size: 11px; color: var(--cyan-accent); margin-bottom: 12px; font-weight:600; letter-spacing: 0.5px;">THEATER DOMAIN BREAKDOWN</div>
          <div id="domain-breakdown-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <!-- Populated dynamically via main.ts -->
          </div>
        </div>
      </section>

      <!-- RIGHT: Audit & Provenance Feed / Tabs -->
      <aside class="col" style="width: 380px;">
        <div class="right-tabs">
          <button id="tabSignals" class="active">SIGNAL FEED</button>
          <button id="tabBrief">BRIEF</button>
          <button id="tabAudit">AUDIT & PROVENANCE</button>
        </div>
        <div class="right-panes">
          <div class="pane col-scroll" id="paneSignals"></div>
          <div class="pane col-scroll hidden-view" id="paneBrief"></div>
          <div class="pane col-scroll hidden-view" id="paneAudit" style="padding: 16px;">
            <!-- Dynamic data integrity and source list -->
            <div id="audit-panel-content">
              <!-- Populated dynamically via main.ts -->
            </div>
          </div>
        </div>
      </aside>

    </main>

    <footer class="ticker">
      <div class="ticker-tag" style="background: var(--danger-red); color: white; padding: 0 8px; font-weight: bold; margin-right: 12px; font-size: 9.5px; height: 100%; display: flex; align-items: center;">STATUS</div>
      <div class="ticker-track anim" id="tickerTrack"></div>
    </footer>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
